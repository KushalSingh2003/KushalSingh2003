<text x="430.0" y="28" text-anchor="middle" fill="#8A8A8A" font-size="13">~/kushal/about.py</text>
<text x="40" y="92" class="ln" style="animation-delay:0.40s"><tspan fill="#FF5A66">me</tspan><tspan fill="#9A9A9A"> = {</tspan></text>
<text x="40" y="124" class="ln" style="animation-delay:0.85s"><tspan fill="#ECBDD8">    &quot;does&quot;</tspan><tspan fill="#9A9A9A">: </tspan><tspan fill="#E5EE4E">&quot;builds full-stack web apps and text-processing tools&quot;</tspan><tspan fill="#9A9A9A">,</tspan></text>
<text x="40" y="156" class="ln" style="animation-delay:1.30s"><tspan fill="#ECBDD8">    &quot;based&quot;</tspan><tspan fill="#9A9A9A">: </tspan><tspan fill="#E5EE4E">&quot;Hyderabad, India&quot;</tspan><tspan fill="#9A9A9A">,</tspan></text>
<text x="40" y="188" class="ln" style="animation-delay:1.75s"><tspan fill="#ECBDD8">    &quot;learning&quot;</tspan><tspan fill="#9A9A9A">: [</tspan><tspan fill="#E5EE4E">&quot;AWS serverless&quot;</tspan><tspan fill="#9A9A9A">, </tspan><tspan fill="#E5EE4E">&quot;CloudFormation&quot;</tspan><tspan fill="#9A9A9A">, </tspan><tspan fill="#E5EE4E">&quot;NLP&quot;</tspan><tspan fill="#9A9A9A">],</tspan></text>
<text x="40" y="220" class="ln" style="animation-delay:2.20s"><tspan fill="#ECBDD8">    &quot;currently&quot;</tspan><tspan fill="#9A9A9A">: </tspan><tspan fill="#E5EE4E">&quot;building MediSlot, a doctor appointment platform&quot;</tspan><tspan fill="#9A9A9A">,</tspan></text>
<text x="40" y="252" class="ln" style="animation-delay:2.65s"><tspan fill="#ECBDD8">    &quot;speaks&quot;</tspan><tspan fill="#9A9A9A">: [</tspan><tspan fill="#E5EE4E">&quot;English&quot;</tspan><tspan fill="#9A9A9A">, </tspan><tspan fill="#E5EE4E">&quot;Hindi&quot;</tspan><tspan fill="#9A9A9A">, </tspan><tspan fill="#E5EE4E">&quot;Punjabi&quot;</tspan><tspan fill="#9A9A9A">],</tspan></text>
<text x="40" y="284" class="ln" style="animation-delay:3.10s"><tspan fill="#9A9A9A">}</tspan></text>
